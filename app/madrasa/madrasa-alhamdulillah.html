<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আলহামদুলিল্লাহ — মাদ্রাসা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<script src="../js/core/mm-textsize.js"></script>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/mm-ui.css">
</head>
<body class="ui-skin">

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-role">মাদ্রাসা</div>
    <div class="topbar-name">আলহামদুলিল্লাহ</div>
  </div>
  <div class="topbar-actions">
    <button type="button" class="topbar-btn" onclick="location.replace('/admin/madrasa.html')">← এডমিন</button>
  </div>
</div>

<div class="content" style="padding-bottom: var(--app-content-pad-bottom);">
  <div id="lp-root"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="../supabase-config.js"></script>
<script src="../js/api/api-shared.js?v=20260723-ah-reason"></script>
<script src="../js/api/api-mdr.js"></script>
<script src="../js/api/api.js?v=20260723-ah-reason"></script>
<script src="../js/madrasa/mdr-supabase-sync.js?v=20260723-ah-reason"></script>
<script src="../js/core/mm-session.js"></script>
<script src="../js/shared/mm-ui.js"></script>
<script src="../js/shared/mm-list-page.js"></script>
<script src="../js/shared/mm-student-modal.js"></script>
<script>
  if (!MMSession.requireAdminPerm('dashboard', '/admin/madrasa.html')) { throw new Error('admin permission denied'); }

  const toBn = (n) => String(n).replace(/[0-9]/g, (d) => '০১২৩৪৫৬৭৮৯'[d]);

  const params = new URLSearchParams(location.search);
  const allowed = MMSession.getAllowedMadrasaDepts();
  let dept = params.get('dept') === 'all' && allowed.length > 1 ? 'all' : (params.get('dept') === 'maktab' ? 'maktab' : 'kitab');
  if (dept !== 'all' && !MMSession.canUseMadrasaDept(dept)) dept = allowed[0] || 'kitab';
  if (dept === 'all' && allowed.length <= 1) dept = allowed[0] || 'kitab';
  const deptName = (d) => d === 'maktab' ? 'মক্তব বিভাগ' : 'কিতাব বিভাগ';
  const deptLabel = dept === 'all' ? 'সামগ্রিক' : deptName(dept);

  function render() {
    const DEPTS = dept === 'all' ? allowed : [dept];
    const clsOrder = {};
    DEPTS.forEach((d, di) => API.Classes.getByDept(d).forEach((c, i) => { clsOrder[c.id] = di * 1000 + i; }));
    const students = DEPTS.flatMap((d) => API.Students.getAlhamdulillahByDeptSorted(d).map((s) => ({ ...s, dept: d })));
    const items = students.map((s) => {
      const cls = API.Classes.getById(s.class_id);
      const reason = String(s.alhamdulillah_reason || '').trim();
      return {
        id: s.id, name: s.name, roll: s.roll, clsId: s.class_id, clsName: cls ? cls.name : '—', clsOrder: clsOrder[s.class_id] || 0,
        dept: s.dept, deptName: DEPTS.length > 1 ? deptName(s.dept) : '', note: reason || 'কারণ লেখা নেই', noteTone: reason ? 'ok' : 'warn', hasReason: !!reason, badge: 'আলহামদুলিল্লাহ', badgeTone: 'ok',
      };
    });
    MMListPage.mount({
      el: 'lp-root',
      title: 'আলহামদুলিল্লাহ',
      sub: deptLabel + ' · যাদের শিক্ষক আলহামদুলিল্লাহ হিসেবে চিহ্নিত করেছেন',
      items,
      buckets: [
        { tone: 'ok', icon: 'star', label: 'আলহামদুলিল্লাহ', sub: 'শিক্ষকের চিহ্নিত' },
        { tone: 'info', icon: 'check', label: 'কারণ লেখা আছে', test: (x) => x.hasReason },
        { tone: 'warn', icon: 'alert', label: 'কারণ লেখা নেই', test: (x) => !x.hasReason },
      ],
      sorts: [{ key: 'def', label: 'বর্ষ অনুযায়ী', cmp: MMListPage.SORT_CLASS.cmp }, MMListPage.SORT_NAME],
      emptyTitle: 'এখনো কেউ নেই', emptyIcon: 'star',
      empty: 'এই বিভাগে কেউ আলহামদুলিল্লাহতে নেই। বর্ষ দায়িত্বশীলের ড্যাশবোর্ডে তারকা চিহ্নিত করলে এখানে দেখা যাবে।',
    });
  }
  async function initAhPage() {
    if (window.MDRSupabaseSync && window.MMMadrasaAPI) {
      try {
        await MDRSupabaseSync.syncAdminStudents();
      } catch (e) {
        console.warn('Alhamdulillah list Supabase sync failed', e);
      }
    }
    render();
  }
  MMLoading.run(initAhPage);
</script>
</body>
</html>
