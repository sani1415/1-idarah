  .hza .hz-toolbar { background:var(--ui-card); border:1px solid var(--ui-bd); border-radius:14px; box-shadow:var(--ui-shadow); padding:10px 12px; }
  .hza .hz-toolbar label { font-size:11.5px; font-weight:600; }

  .hza .ui-panel .hz-row-main span { font-size:12px; }
  .hza .ui-panel .hz-row-st { font-size:12px; }
  .hza .ui-panel .hz-empty { box-shadow:none; background:transparent; margin:0; }
  .hza .hza-pending { margin-bottom:10px; border-color:rgba(181,87,58,.35); }
  .hza .hza-sum { margin-bottom:10px; }
  .hza .hza-bar { width:22%; min-width:80px; }
  .hza .hz-tbl-wrap { border:1px solid var(--ui-bd); border-radius:14px; box-shadow:var(--ui-shadow); background:var(--ui-card); }
  .hza .hz-tbl { font-size:12.5px; }
  .hza .hz-tbl th { font-size:12px; background:var(--cream); }
  .hza .hz-tbl td small { font-size:11px; }
  .hza .hz-panel { border-radius:16px; border-color:var(--ui-bd); background:var(--ui-card); box-shadow:var(--ui-shadow); }
  .hza .hz-empty { border:1px solid var(--ui-bd); box-shadow:none; background:var(--ui-card); }
  @media (max-width:640px) { .hza .hz-head .ui-title { display:none; } .hza .hza-bar { display:none; } }
