<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অনুপস্থিত তালিকা — মাদ্রাসা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<script src="../js/core/mm-textsize.js"></script>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/mm-ui.css">
<script src="../js/shared/mm-ui.js"></script>
</head>
<body class="ui-skin">

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-role">মাদ্রাসা</div>
    <div class="topbar-name">অনুপস্থিত তালিকা</div>
  </div>
  <div class="topbar-actions">
    <button type="button" class="topbar-btn" onclick="location.replace('/admin/madrasa.html')">← এডমিন</button>
  </div>
</div>

<div class="content" style="padding-bottom: var(--app-content-pad-bottom);">
  <div id="lp-root"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="../supabase-config.js"></script>
<script src="../js/api/api-shared.js"></script>
<script src="../js/api/api-mdr.js"></script>
<script src="../js/api/api.js"></script>
<script src="../js/madrasa/mdr-supabase-sync.js"></script>
<script src="../js/core/mm-session.js"></script>
<script src="../js/shared/mm-list-page.js"></script>
<script src="../js/shared/mm-student-save.js"></script>
<script src="../js/shared/mm-student-modal.js"></script>
<script>
  if (!MMSession.requireAdminPerm('dashboard', '/admin/madrasa.html')) { throw new Error('admin permission denied'); }

  const toBn = (n) => String(n).replace(/[0-9]/g, (d) => '০১২৩৪৫৬৭৮৯'[d]);

  const params = new URLSearchParams(location.search);
  const allowed = MMSession.getAllowedMadrasaDepts();
  let dept = params.get('dept') === 'all' && allowed.length > 1 ? 'all' : (params.get('dept') === 'maktab' ? 'maktab' : 'kitab');
  if (dept !== 'all' && !MMSession.canUseMadrasaDept(dept)) dept = allowed[0] || 'kitab';
  if (dept === 'all' && allowed.length <= 1) dept = allowed[0] || 'kitab';
  const deptName = (d) => d === 'maktab' ? 'মক্তব বিভাগ' : 'কিতাব বিভাগ';
  const deptLabel = dept === 'all' ? 'সামগ্রিক' : deptName(dept);

  function scopeDepts() {
    if (dept === 'all') return allowed.filter((d) => d === 'kitab' || d === 'maktab');
    return allowed.includes(dept) ? [dept] : [allowed[0] || 'kitab'];
  }

  function render() {
    const depts = scopeDepts();
    let rows = API.loadDaftarAbsentSummaryRows ? API.loadDaftarAbsentSummaryRows(depts) : null;
    if (!rows || !rows.length) {
      rows = depts.flatMap((d) => API.Attendance.getStudentsWithAbsentSortedByDept(d).map((x) => ({ ...x, dept: d })));
    }
    const clsOrder = {};
    depts.forEach((d, di) => API.Classes.getByDept(d).forEach((c, i) => { clsOrder[c.id] = di * 1000 + i; }));
    const today = API.today();
    const clsCache = {};
    function absentToday(s) {
      const cid = s.class_id;
      if (!cid) return false;
      if (!clsCache[cid]) {
        clsCache[cid] = new Set(API.Attendance.getByClassDate(cid, today)
          .filter((a) => API.Attendance.statusOf(a) === 'absent').map((a) => String(a.student_id)));
      }
      return clsCache[cid].has(String(s.id)) || (s.supabase_id && clsCache[cid].has(String(s.supabase_id)));
    }
    const max = rows.reduce((m, x) => Math.max(m, x.absentDays || 0), 1);
    const showDept = depts.length > 1;
    const items = rows.filter((x) => x.student).map((x) => {
      const s = x.student;
      const cls = API.Classes.getById(s.class_id);
      const v = x.absentDays || 0;
      const streak = typeof x.absentStreak === 'number' ? x.absentStreak : (API.Attendance.getSessionAbsentStreak ? API.Attendance.getSessionAbsentStreak(s) : 0);
      const isToday = absentToday(s);
      const tone = MMListPage.dayTone(v);
      return {
        id: s.id, name: s.name, roll: s.roll, clsId: s.class_id, clsName: cls ? cls.name : '—', clsOrder: clsOrder[s.class_id] || 0,
        deptName: showDept ? deptName(x.dept) : '', value: v,
        badge: toBn(v) + ' দিন', badgeTone: tone, bar: Math.round(v / max * 100), barTone: tone,
        note: streak >= 2 ? 'টানা ' + toBn(streak) + ' দিন' : (isToday ? 'আজ অনুপস্থিত' : ''), noteTone: 'bad',
      };
    });
    MMListPage.mount({
      el: 'lp-root',
      title: 'অনুপস্থিত তালিকা',
      sub: deptLabel + ' · শিক্ষাবর্ষ শুরু থেকে · বেশি দিন আগে',
      items,
      buckets: MMListPage.dayBuckets('তালিকায়', 'কমপক্ষে ১ দিন অনুপস্থিত'),
      sorts: [MMListPage.SORT_DAYS, MMListPage.SORT_CLASS, MMListPage.SORT_NAME],
      emptyTitle: 'কেউ অনুপস্থিত নেই', emptyIcon: 'check',
      empty: 'কোনো ছাত্রের অনুপস্থিত রেকর্ড নেই। উপস্থিতি স্ক্রিনে অনুপস্থিত চিহ্নিত করলে এখানে দেখা যাবে।',
    });
  }

  async function initPage() {
    if (window.MDRSupabaseSync && window.MMSharedAPI) {
      try { await MDRSupabaseSync.syncAdminUsers(); } catch (e) { console.warn('teacher sync failed', e); }
      try { await MDRSupabaseSync.syncAdminStudents(); } catch (e) { console.warn('student sync failed', e); }
    }
    render();
  }

  MMLoading.run(initPage);
</script>
</body>
</html>
