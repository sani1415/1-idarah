<style>
  .dars-book-btn { display:inline; border:0; background:none; padding:0; margin:0; font:inherit; font-weight:700; color:var(--ink); text-align:left; cursor:pointer; }
  .dars-book-btn:hover { color:var(--ui-accent); text-decoration:underline; }
  .dars-book { padding:10px 14px; border-bottom:1px solid var(--cream2); }
  .dars-book:last-child { border-bottom:none; }
  .dars-book-t { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px; }
  .dars-book-meta { font-size:12px; color:var(--ink3); margin-top:5px; }
  .dars-book-meta .ui-badge { margin-left:4px; }
  .dars-pct { font-size:15px; font-weight:800; }
  .dars-empty { text-align:center; color:var(--ink3); padding:20px; font-size:13px; }
  .dars-grid { margin-bottom: 12px; }
  .hist-row { padding:10px 0; border-bottom:1px solid var(--cream2); }
  .hist-row:last-child { border-bottom:none; }
  .hist-date { font-size:11px; color:var(--ink3); margin-bottom:3px; }
  .hist-main { font-size:13px; color:var(--ink2); font-weight:700; }
  .hist-note { font-size:12px; color:var(--ink3); margin-top:4px; line-height:1.45; }
  .content { padding-bottom:var(--app-content-pad-bottom); }

  /* ══ Desktop (≥ 960px) ══ */
  @media (min-width: 960px) {
    html body .content { max-width: 1100px; }
    .dars-panel { max-width: none; }
    .dars-book { padding: 12px 16px; }
    .dars-book-n { font-size: 14px; }
    .dars-pct { font-size: 13px; }
    .dars-tab { font-size: 13px; padding: 12px 8px; }
  }
</style>

<div class="content ui-wide ui-cq">
  <div class="ui-head"><div class="ui-head-l"><h2 class="ui-title">দরস — কিতাব পড়া</h2><span class="ui-sub" id="dars-sub">সব বর্ষ একসাথে · কিতাবে চাপলে হালনাগাদের ইতিহাস</span></div></div>
  <div class="ui-stats" id="dars-stats"></div>
  <div class="ui-box ui-tabs" id="dars-tabs">
    <button type="button" class="ui-tab is-on" id="dtab-a" onclick="setDept('all')">সামগ্রিক</button>
    <button type="button" class="ui-tab" id="dtab-k" onclick="setDept('kitab')">কিতাব বিভাগ</button>
    <button type="button" class="ui-tab" id="dtab-m" onclick="setDept('maktab')">মক্তব বিভাগ</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="../../supabase-config.js"></script>
<script src="../../js/api/api-shared.js"></script>
<script src="../../js/api/api-mdr.js"></script>
<script src="../../js/api/api.js"></script>
<script src="../../js/core/mm-session.js"></script>
<script src="../../js/core/mm-shell.js"></script>
<script src="../../js/madrasa/mdr-supabase-sync.js"></script>
<script>
  if (!MMSession.requireAdminPerm('dars', '/admin/madrasa.html')) { throw new Error('admin permission denied'); }
  const toBn = n => String(n).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  let dept = 'all';
  (function() {
    const allowed = MMSession.getAllowedMadrasaDepts();
    try {
      const d = new URLSearchParams(location.search).get('dept');
      if (d === 'all' && allowed.length > 1) dept = 'all';
      if ((d === 'kitab' || d === 'maktab') && MMSession.canUseMadrasaDept(d)) dept = d;
    } catch (e) {}
    if (dept !== 'all' && !MMSession.canUseMadrasaDept(dept)) dept = allowed[0] || 'kitab';
    if (dept === 'all' && allowed.length <= 1) dept = allowed[0] || 'kitab';
  })();
  let filter = '';   // '' | 'behind' | 'stale'
  const STALE_DAYS = 7;
  const BEHIND_GAP = 15;

  function sortClasses(list) {
    return [...list].sort((a, b) => {
      const o = (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0);
      if (o !== 0) return o;
      return String(a.name || '').localeCompare(String(b.name || ''), 'bn');
    });
  }

  function deptLabel(d) { return d === 'maktab' ? 'মক্তব বিভাগ' : 'কিতাব বিভাগ'; }
  function getScopeDepts() {
    const allowed = MMSession.getAllowedMadrasaDepts();
    return dept === 'all' ? allowed : [dept];
  }
  function currentClasses() {
    return getScopeDepts().flatMap(d => sortClasses(API.Classes.getByDept(d)).map(c => ({ ...c, dept: d })));
  }

  function setDept(d) {
    const allowed = MMSession.getAllowedMadrasaDepts();
    if (d === 'all' && allowed.length <= 1) return;
    if (d !== 'all' && !MMSession.canUseMadrasaDept(d)) return;
    dept = d;
    document.getElementById('dtab-a').classList.toggle('is-on', d === 'all');
    document.getElementById('dtab-k').classList.toggle('is-on', d === 'kitab');
    document.getElementById('dtab-m').classList.toggle('is-on', d === 'maktab');
    document.getElementById('dtab-a').style.display = allowed.length > 1 ? '' : 'none';
    document.getElementById('dtab-k').style.display = MMSession.canUseMadrasaDept('kitab') ? '' : 'none';
    document.getElementById('dtab-m').style.display = MMSession.canUseMadrasaDept('maktab') ? '' : 'none';
    document.getElementById('dars-tabs').style.display = allowed.length > 1 ? '' : 'none';
    renderAll();
  }

  function setFilter(f) {
    filter = filter === f ? '' : f;
    renderAll();
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const p = String(iso).slice(0, 10).split('-');
    if (p.length < 3) return API.esc(iso);
    return toBn(parseInt(p[2], 10)) + '/' + toBn(parseInt(p[1], 10)) + '/' + toBn(p[0]);
  }

  function barPct(done, total) {
    const t = Number(total) || 0;
    const d = Math.max(0, Number(done) || 0);
    if (t <= 0) return d > 0 ? 100 : 0;
    return Math.min(100, Math.round((d / t) * 1000) / 10);
  }

  function teacherMap() {
    const m = {};
    getScopeDepts().forEach(d => API.Teachers.getByDept(d).forEach(t => { m[t.class_id] = t.name; }));
    return m;
  }

  function jsArg(v) {
    return String(v || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  /** শিক্ষাবর্ষের কত ভাগ সময় গেছে (হিজরি বছর ≈ ৩৫৪ দিন); শুরু জানা না থাকলে null */
  function elapsedPct() {
    let start = null;
    try {
      const st = API.Settings && API.Settings.get ? API.Settings.get() : null;
      if (st && st.session_start_date) start = String(st.session_start_date).slice(0, 10);
    } catch (e) {}
    try {
      if (!start && API.Sessions && API.Sessions.getCurrent) {
        const cur = API.Sessions.getCurrent();
        if (cur && cur.start_date) start = String(cur.start_date).slice(0, 10);
      }
    } catch (e) {}
    if (!start) return null;
    const days = (new Date(API.today() + 'T12:00:00') - new Date(start + 'T12:00:00')) / 86400000;
    if (!(days >= 0)) return null;
    return Math.min(100, Math.round(days / 354 * 100));
  }

  function daysSince(iso) {
    if (!iso) return Infinity;
    return Math.floor((new Date(API.today() + 'T12:00:00') - new Date(String(iso).slice(0, 10) + 'T12:00:00')) / 86400000);
  }

  function bookInfo(k, elapsed) {
    const total = k.total_pages != null ? Number(k.total_pages) : 0;
    const done = Number(k.pages_done) || 0;
    const pct = barPct(done, total);
    const behind = elapsed != null && total > 0 && pct < elapsed - BEHIND_GAP;
    const gap = elapsed != null ? elapsed - pct : 0;
    const tone = elapsed == null ? MMUI.pctTone(pct).replace('ui-', '') : (behind ? 'bad' : gap > 5 ? 'warn' : 'ok');
    const stale = daysSince(k.last_updated) > STALE_DAYS && pct < 100;
    return { k, total, done, pct, behind, stale, tone };
  }

  function renderAll() {
    const el = document.getElementById('dars-detail');
    const classes = currentClasses();
    const tm = teacherMap();
    const elapsed = elapsedPct();
    const all = classes.map(cls => ({ cls, books: API.KitabProgress.getByClass(cls.id).map(k => bookInfo(k, elapsed)) }));
    const books = all.flatMap(x => x.books);
    const withTotal = books.filter(b => b.total > 0);
    const avg = withTotal.length ? Math.round(withTotal.reduce((s0, b) => s0 + b.pct, 0) / withTotal.length) : 0;
    const nBehind = books.filter(b => b.behind).length;
    const nStale = books.filter(b => b.stale).length;

    document.getElementById('dars-stats').innerHTML =
      MMUI.stat({ tone: 'info', icon: 'book', label: 'মোট কিতাব', value: toBn(books.length) + 'টি', sub: toBn(classes.length) + 'টি বর্ষে' }) +
      MMUI.stat({ tone: elapsed == null ? MMUI.pctTone(avg).replace('ui-', '') : (avg >= elapsed - 5 ? 'ok' : avg >= elapsed - BEHIND_GAP ? 'warn' : 'bad'), icon: 'check', label: 'গড় অগ্রগতি', value: toBn(avg) + '%',
        sub: elapsed != null ? 'শিক্ষাবর্ষের ' + toBn(elapsed) + '% সময় গেছে' : '' }) +
      MMUI.stat({ tone: nBehind ? 'bad' : 'ok', icon: 'alert', label: 'পিছিয়ে আছে', value: toBn(nBehind) + 'টি কিতাব',
        sub: elapsed != null ? 'সময়ের চেয়ে ' + toBn(BEHIND_GAP) + '%+ কম' : 'শিক্ষাবর্ষ শুরু জানা নেই', on: filter === 'behind', onclick: elapsed != null ? "setFilter('behind')" : '' }) +
      MMUI.stat({ tone: nStale ? 'warn' : 'ok', icon: 'clock', label: 'হালনাগাদ হয়নি', value: toBn(nStale) + 'টি', sub: toBn(STALE_DAYS) + ' দিনের বেশি', on: filter === 'stale', onclick: "setFilter('stale')" });

    document.getElementById('dars-sub').textContent = filter === 'behind' ? 'শুধু পিছিয়ে থাকা কিতাব · আবার চাপলে সব'
      : filter === 'stale' ? 'শুধু হালনাগাদ-না-হওয়া কিতাব · আবার চাপলে সব'
      : 'সব বর্ষ একসাথে · কিতাবে চাপলে হালনাগাদের ইতিহাস';

    if (!classes.length) {
      el.innerHTML = '<div class="ui-box">' + MMUI.empty({ icon: 'book', title: 'এ বিভাগে কোনো বর্ষ নেই' }) + '</div>';
      return;
    }
    const panels = all.map(({ cls, books: bs }) => {
      const shown = bs.filter(b => !filter || (filter === 'behind' ? b.behind : b.stale));
      if (filter && !shown.length) return '';
      const rows = shown.length ? shown.map(b => `<div class="dars-book">
          <div class="dars-book-t"><button type="button" class="dars-book-btn" onclick="openHistoryModal('${jsArg(cls.id)}','${jsArg(b.k.id)}')">${API.esc(b.k.name || '—')}</button>
            <span class="dars-pct ui-${b.tone}">${toBn(Math.round(b.pct))}%</span></div>
          <span class="ui-track"><span class="ui-fill ui-${b.tone}" style="width:${Math.min(100, b.pct)}%"></span></span>
          <div class="dars-book-meta">${toBn(b.done)} / ${b.total ? toBn(b.total) : '—'} পৃষ্ঠা · হালনাগাদ ${fmtDate(b.k.last_updated)}${b.stale ? '<span class="ui-badge is-warn">হালনাগাদ হয়নি</span>' : ''}${b.behind ? '<span class="ui-badge is-bad">পিছিয়ে</span>' : ''}</div>
        </div>`).join('') : '<div class="dars-empty">এ বর্ষে কোনো কিতাব যোগ নেই।</div>';
      return `<section class="ui-box ui-panel">
        <div class="ui-ph"><h3>${API.esc(cls.name)}</h3><small>${dept === 'all' ? deptLabel(cls.dept) + ' · ' : ''}${API.esc(tm[cls.id] || '—')}</small></div>
        ${rows}
      </section>`;
    }).join('');
    el.innerHTML = panels || '<div class="ui-box">' + MMUI.empty({ icon: 'check', title: filter === 'behind' ? 'কোনো কিতাব পিছিয়ে নেই' : 'সব কিতাব হালনাগাদ আছে', sub: 'আবার ঘরে চাপলে সব কিতাব দেখাবে' }) + '</div>';
  }

  function openHistoryModal(classId, bookId) {
    const book = API.KitabProgress.getByClass(classId).find(k => k.id === bookId);
    if (!book) return;
    document.getElementById('hist-title').textContent = (book.name || 'কিতাব') + ' — হালনাগাদ ইতিহাস';
    const hist = Array.isArray(book.history) ? book.history : [];
    document.getElementById('hist-body').innerHTML = hist.length ? hist.map(h => {
      const done = Number(h.pages_done) || 0;
      const total = Number(book.total_pages) || 0;
      const pct = Math.round(barPct(done, total));
      return `<div class="hist-row">
        <div class="hist-date">${fmtDate(h.date)}</div>
        <div class="hist-main">${toBn(done)} পৃষ্ঠা${total ? ' / ' + toBn(total) : ''} · ${toBn(pct)}%</div>
        ${h.note ? `<div class="hist-note">${API.esc(h.note)}</div>` : ''}
      </div>`;
    }).join('') : '<div class="dars-empty">এ বইয়ের কোনো হালনাগাদ ইতিহাস নেই।</div>';
    document.getElementById('modal-dars-history').classList.add('open');
  }

  function closeHistoryModal() {
    document.getElementById('modal-dars-history').classList.remove('open');
  }
  async function initDarsPage() {
    const el = document.getElementById('dars-detail');
    if (el) el.innerHTML = MMUI.skeleton({ rows: 4 });
    if (window.MDRSupabaseSync && MMSession.getAdminPin && MMSession.getAdminPin()) {
      try {
        await MDRSupabaseSync.syncAdminDars();
      } catch (e) {
        console.warn('admin dars sync failed', e);
      }
    }
    setDept(dept);
  }

  MMLoading.run(initDarsPage);
</script>
<script src="../../js/shared/admin-nav.js"></script>
