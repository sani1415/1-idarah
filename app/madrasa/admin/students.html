<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বর্তমান ছাত্র — জিম্মাদার</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  .st-list { overflow: hidden; }
  .st-list-inner { display: grid; grid-template-columns: minmax(0, 1fr); }
  .st-roll { min-width: 34px; padding: 3px 7px; border-radius: 999px; background: var(--cream2); color: var(--ink3); text-align: center; font-size: 11.5px; font-weight: 700; flex-shrink: 0; }
  .st-row { gap: 10px; justify-content: flex-start; }
  .st-row .ui-row-main { display: flex; flex-direction: column; }
  .st-cls { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: transparent; border: none; border-bottom: 1px solid var(--cream2); padding: 9px 14px; cursor: pointer; }
  .st-cls:last-child { border-bottom: none; }
  .st-cls:hover { background: var(--cream); }
  .st-cls.is-on { background: var(--ui-bad-bg); box-shadow: inset 3px 0 0 var(--ui-accent); }
  .st-cls-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .st-cls-top small { color: var(--ink3); font-size: 12px; }
  .st-cls .ui-track { margin-top: 6px; height: 6px; }
  .st-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; }
  .st-side { position: sticky; top: 12px; }
  .st-search { position: relative; }
  .st-search svg { position: absolute; left: 10px; bottom: 10px; color: var(--ink-muted); pointer-events: none; }
  .st-search input { padding-left: 32px !important; }
  @container (min-width: 900px) {
    .st-main { grid-template-columns: minmax(0, 1fr) 280px; }
    .st-list-inner { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .st-list-inner .ui-row:nth-child(odd) { border-right: 1px solid var(--cream2); }
  }
  @container (min-width: 1300px) { .st-list-inner { grid-template-columns: repeat(3, minmax(0, 1fr)); } .st-list-inner .ui-row { border-right: 1px solid var(--cream2); } }
  @container (max-width: 899px) {
    .st-side { order: -1; position: static; }
    .st-side .ui-ph small { display: none; }
    #class-breakdown { display: flex; gap: 8px; overflow-x: auto; padding: 8px 10px 10px; }
    .st-cls { flex: 0 0 150px; border: 1px solid var(--ui-bd); border-radius: 12px; padding: 8px 10px; background: #fff; }
    .st-cls:last-child { border-bottom: 1px solid var(--ui-bd); }
  }
  @media (max-width: 640px) { .st-head .ui-title { display: none; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-role">জিম্মাদার</div>
    <div class="topbar-name">বর্তমান ছাত্র তালিকা</div>
  </div>
  <div class="topbar-actions">
    <button type="button" class="topbar-btn" onclick="location.replace('/admin/madrasa.html')">← এডমিন</button>
  </div>
</div>

<div class="content content-nav-pad">
  <div class="ui-wide ui-cq">
  <div class="ui-head st-head">
    <div class="ui-head-l"><h2 class="ui-title">বর্তমান ছাত্র তালিকা</h2><span class="ui-sub" id="list-count">—</span></div>
  </div>
  <div class="ui-stats" id="st-stats"></div>
  <div class="ui-box ui-filters">
    <label class="ui-field"><span>বিভাগ</span><select id="dept-filter" onchange="switchDept(this.value)"></select></label>
    <label class="ui-field"><span>বর্ষ/শ্রেণি</span><select id="class-filter" onchange="renderStudents()"><option value="">সব বর্ষ/শ্রেণি</option></select></label>
    <label class="ui-field"><span>সাজানো</span><select id="sort-filter" onchange="renderStudents()">
      <option value="class_roll">বর্ষ ও পরিচিতি অনুযায়ী</option>
      <option value="name">নাম অনুযায়ী</option>
      <option value="id">স্থায়ী দাখেলা অনুযায়ী</option>
    </select></label>
    <label class="ui-field st-search"><span>খুঁজুন</span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="search-box" type="search" placeholder="নাম / দাখেলা / পরিচিতি / ফোন" oninput="renderStudents()"></label>
  </div>
  <div class="st-main">
    <section class="ui-box ui-panel st-list"><div class="ui-ph"><h3 id="list-title">ছাত্র</h3><small>নামে চাপলে বিবরণ</small></div><div class="st-list-inner" id="student-list"></div></section>
    <aside class="ui-box ui-panel st-side"><div class="ui-ph"><h3>বর্ষভিত্তিক ছাত্র</h3><small>চাপলে শুধু সেই বর্ষ</small></div><div id="class-breakdown"></div></aside>
  </div>
  </div>
  <div class="pb-safe"></div>
</div>

  <a class="main-nav-btn" href="/admin/khedmat.html" aria-label="খেদমত"><svg class="main-nav-ico" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg><span class="main-nav-lbl">খেদমত</span></a>
  <a class="main-nav-btn" href="../../chat.html" aria-label="বার্তা"><svg class="main-nav-ico" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M22 6l-10 7L2 6"/></svg><span class="main-nav-lbl">বার্তা</span></a>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="../../supabase-config.js"></script>
<script src="../../js/api/api-shared.js?v=20260717-photo-daftar"></script>
<script src="../../js/api/api-mdr.js"></script>
<script src="../../js/api/api.js?v=20260517-attendance-consistency"></script>
<script src="../../js/core/mm-hijri.js"></script>
<script src="../../js/shared/mm-student-modal.js?v=20260717-photo-toolbar"></script>
<script src="../../js/core/mm-session.js"></script>
<script src="../../js/core/mm-shell.js"></script>
<script src="../../js/madrasa/mdr-supabase-sync.js"></script>
<script>
  if (!MMSession.requireAdminPerm('dashboard', '/admin/madrasa.html')) { throw new Error('admin permission denied'); }
  const allowedDepts = MMSession.getAllowedMadrasaDepts();
  const bnNum = n => String(n).replace(/[0-9]/g, d => String.fromCharCode(0x09E6 + Number(d)));
  const params = new URLSearchParams(location.search);
  let currentDept = readDept(params.get('dept'));

  function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
  function deptLabel(dept) { return dept === 'maktab' ? 'মক্তব' : dept === 'kitab' ? 'কিতাব' : 'সামগ্রিক'; }
  function readDept(raw) {
    if (raw === 'all' && allowedDepts.length > 1) return 'all';
    if ((raw === 'kitab' || raw === 'maktab') && allowedDepts.includes(raw)) return raw;
    return allowedDepts.length > 1 ? 'all' : (allowedDepts[0] || 'kitab');
  }
  function scopeDepts() {
    if (currentDept === 'kitab' || currentDept === 'maktab') return [currentDept];
    return allowedDepts.filter(d => d === 'kitab' || d === 'maktab');
  }
  function classMap() {
    return Object.fromEntries(API.Classes.getAll(true).map(c => [c.id, c]));
  }
  function activeStudents() {
    const cMap = classMap();
    const depts = new Set(scopeDepts());
    return API.Students.getAll().filter(s => s.active && cMap[s.class_id] && depts.has(cMap[s.class_id].dept));
  }
  function renderDeptFilter() {
    const opts = [];
    if (allowedDepts.length > 1) opts.push(['all','সামগ্রিক']);
    if (allowedDepts.includes('kitab')) opts.push(['kitab','কিতাব']);
    if (allowedDepts.includes('maktab')) opts.push(['maktab','মক্তব']);
    document.getElementById('dept-filter').innerHTML = opts.map(([key,label]) =>
      `<option value="${key}">${label}</option>`
    ).join('');
    document.getElementById('dept-filter').value = currentDept;
  }
  function switchDept(dept) {
    currentDept = readDept(dept);
    const url = new URL(location.href);
    url.searchParams.set('dept', currentDept);
    history.replaceState(null, '', url.toString());
    renderAll();
  }
  function renderClassFilter() {
    const depts = new Set(scopeDepts());
    const classes = API.Classes.getAll().filter(c => depts.has(c.dept));
    document.getElementById('class-filter').innerHTML =
      '<option value="">সব বর্ষ/শ্রেণি</option>' +
      classes.map(c => `<option value="${API.esc(c.id)}">${currentDept==='all' ? deptLabel(c.dept)+' — ' : ''}${API.esc(c.name)}</option>`).join('');
  }
  function filteredStudents() {
    const cMap = classMap();
    const cid = document.getElementById('class-filter').value;
    const q = document.getElementById('search-box').value.trim().toLowerCase();
    const sort = document.getElementById('sort-filter').value;
    let list = activeStudents().filter(s => !cid || s.class_id === cid);
    if (q) {
      list = list.filter(s => [s.name, s.permanent_id, s.roll, s.guardian, s.phone, s.district, s.upazila]
        .some(v => String(v || '').toLowerCase().includes(q)));
    }
    list.sort((a,b) => {
      if (sort === 'name') return String(a.name||'').localeCompare(String(b.name||''), 'bn');
      if (sort === 'id') return String(a.permanent_id||'').localeCompare(String(b.permanent_id||''), 'bn');
      const ca = cMap[a.class_id] || {}, cb = cMap[b.class_id] || {};
      const byClass = (ca.sort_order || 999) - (cb.sort_order || 999);
      return byClass || String(a.roll||'').localeCompare(String(b.roll||''), 'bn', { numeric:true });
    });
    return list;
  }
  function renderStudents() {
    const cMap = classMap();
    const list = filteredStudents();
    const cid = document.getElementById('class-filter').value;
    document.getElementById('list-count').textContent = `${deptLabel(currentDept)} — ${bnNum(list.length)} জন বর্তমান ছাত্র`;
    document.getElementById('list-title').textContent = (cid && cMap[cid] ? cMap[cid].name : 'ছাত্র') + ` (${bnNum(list.length)} জন)`;
    renderBreakdown();
    if (!list.length) {
      document.getElementById('student-list').innerHTML = '<div class="ui-empty">এই বাছাইয়ে কোনো ছাত্র নেই।</div>';
      return;
    }
    document.getElementById('student-list').innerHTML = list.map(s => {
      const cls = cMap[s.class_id] || {};
      return `<div class="ui-row is-link st-row" onclick="MMStudentModal.open('${API.esc(s.id)}')">
        <span class="st-roll">${API.escBn(s.roll || '—')}</span>
        <span class="ui-row-main"><span class="ui-row-name">${API.esc(s.name)}</span>
        <span class="ui-row-meta">দাখেলা ${API.escBn(s.permanent_id || '—')}${cid ? '' : ' · ' + API.esc((currentDept === 'all' ? deptLabel(cls.dept) + ' — ' : '') + (cls.name || '—'))}</span></span>
      </div>`;
    }).join('');
  }
  /* উপরের ঘর আর ডানের বর্ষভিত্তিক সংখ্যা — বিভাগ অনুযায়ী (বর্ষ/খোঁজা বাছাই বাদে) */
  function renderBreakdown() {
    const all = activeStudents();
    const depts = new Set(scopeDepts());
    const classes = API.Classes.getAll().filter(c => depts.has(c.dept));
    const cid = document.getElementById('class-filter').value;
    const counts = {};
    all.forEach(s => { counts[s.class_id] = (counts[s.class_id] || 0) + 1; });
    const max = Math.max(1, ...Object.values(counts));
    document.getElementById('class-breakdown').innerHTML = classes.filter(c => counts[c.id]).map(c => {
      const on = cid === c.id;
      return `<button type="button" class="st-cls${on ? ' is-on' : ''}" onclick="pickClass('${API.esc(on ? '' : c.id)}')">
        <span class="st-cls-top"><b>${API.esc(c.name)}</b><small>${bnNum(counts[c.id])} জন</small></span>
        <span class="ui-track"><span class="ui-fill" style="width:${Math.round(counts[c.id] / max * 100)}%"></span></span></button>`;
    }).join('') || '<div class="ui-empty">কোনো বর্ষ নেই</div>';
    const U = window.MMUI;
    const cMap = classMap();
    const kitab = all.filter(s => (cMap[s.class_id] || {}).dept === 'kitab').length;
    const maktab = all.filter(s => (cMap[s.class_id] || {}).dept === 'maktab').length;
    const hifz = all.filter(s => s.hifz).length;
    document.getElementById('st-stats').innerHTML =
      U.stat({ tone: 'info', icon: 'users', label: 'মোট ছাত্র', value: bnNum(all.length), sub: deptLabel(currentDept) }) +
      U.stat({ tone: 'ok', icon: 'book', label: 'কিতাব বিভাগ', value: bnNum(kitab), sub: bnNum(classes.filter(c => c.dept === 'kitab').length) + 'টি বর্ষ' }) +
      U.stat({ tone: 'warn', icon: 'star', label: 'মক্তব বিভাগ', value: bnNum(maktab), sub: bnNum(classes.filter(c => c.dept === 'maktab').length) + 'টি শ্রেণি' }) +
      U.stat({ tone: 'deep', icon: 'cal', label: 'হিফজে', value: bnNum(hifz), sub: 'হিফজে নির্বাচিত' });
  }
  function pickClass(id) {
    document.getElementById('class-filter').value = id;
    renderStudents();
  }
  function renderAll() {
    renderDeptFilter();
    renderClassFilter();
    renderStudents();
  }
  async function initPage() {
    try {
      await MDRSupabaseSync.syncAdminStudents();
    } catch (e) {
      showToast('ছাত্র তালিকা আনা যায়নি — ইন্টারনেট দেখে আবার চেষ্টা করুন');
      console.warn('madrasa supabase sync failed', e);
    }
    renderAll();
  }
  MMLoading.run(initPage);
</script>
<script src="../../js/shared/mm-ui.js"></script>
<script src="../../js/shared/admin-nav.js"></script>
</body>
