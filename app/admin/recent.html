    <button type="button" class="topbar-btn topbar-btn--icon" onclick="MMSession.logoutToIndex('../index.html')" title="লগআউট" aria-label="লগআউট"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>

<main class="content recent-wrap">
  <section class="recent-head">
    <div class="recent-head-top">
      <div>
        <div class="recent-title">সাম্প্রতিক কার্যক্রম</div>
        <div class="recent-sub">মাদ্রাসা, বিভাগ, কর্মসূচি, খেদমত, দর্স ও বার্তা — সর্বশেষ আপডেট এক জায়গায়</div>
      </div>
      <button type="button" class="recent-refresh" id="recent-refresh-btn" title="ডাটা রিফ্রেশ">↻ রিফ্রেশ</button>
    </div>
    <div class="recent-status" id="recent-sync-status" aria-live="polite">ডাটা প্রস্তুত হচ্ছে…</div>
  </section>
  <div class="recent-filters" id="recent-filters" role="tablist" aria-label="ফিড ফিল্টার"></div>
  <div class="recent-count" id="recent-count" hidden></div>
  <div id="recent-feed"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../js/api/api-shared.js"></script>
<script src="../js/api/api-mdr.js"></script>
<script src="../js/api/api.js"></script>
<script src="../js/core/mm-sample-data.js"></script>
<script src="../js/core/mm-session.js"></script>
<script src="../js/madrasa/mdr-supabase-sync.js"></script>
<script src="../js/dept/dept-api.js"></script>
<script src="../js/dept/dept-supabase-sync.js"></script>
<script src="../js/khedmat/khedmat-api.js"></script>
<script src="../js/shared/chat-api.js"></script>
<script src="../js/shared/admin-recent-feed.js"></script>
<script>
  if (!MMSession.requireAdminPerm('recent', '/admin/madrasa.html')) { throw new Error('admin permission denied'); }

  const restricted = MMSession.isRestrictedAdmin();
  const khActorId = MMSession.getId ? MMSession.getId() : MMSession.getAdminUserId();
  const khPin = MMSession.getPin ? MMSession.getPin() : MMSession.getAdminPin();
  const chatActorId = MMSession.getChatActorId ? MMSession.getChatActorId() : khActorId;
  const chatPin = MMSession.getChatPin ? MMSession.getChatPin() : khPin;
  const initialFilterParam = new URLSearchParams(location.search).get('filter');
  let activeFilter = initialFilterParam || 'all';
  let isLoading = false;
  let feedBootstrapStarted = false;
  const REVIEW_ITEMS_TIMEOUT_MS = 12000;

  const esc = (s) => AdminRecentFeed.esc(s);
  const bn = (v) => AdminRecentFeed.bn(v);

  function setSyncStatus(text, type) {
    const el = document.getElementById('recent-sync-status');
    if (!el) return;
    el.textContent = text;
    el.className = 'recent-status' + (type === 'ok' ? ' is-ok' : type === 'warn' ? ' is-warn' : '');
  }

  function renderFilters() {
    const cats = AdminRecentFeed.getCategories().filter((c) => {
      if (restricted && c.key !== 'all' && c.key !== 'madrasa' && c.key !== 'review') return false;
      return true;
    });
    document.getElementById('recent-filters').innerHTML = cats.map((c) =>
      `<button type="button" class="recent-filter${c.key === activeFilter ? ' is-active' : ''}" data-filter="${esc(c.key)}" role="tab" aria-selected="${c.key === activeFilter}">${esc(c.label)}</button>`
    ).join('');
    document.querySelectorAll('.recent-filter').forEach((btn) => {
      btn.onclick = async () => {
        activeFilter = btn.getAttribute('data-filter') || 'all';
        renderFilters();
        if (activeFilter === 'chat' && !restricted) {
          try {
            await AdminRecentFeed.syncChatForFeed({ pin: khPin, actorId: khActorId, chatPin, chatActorId });
          } catch (e) {
            console.warn('[Recent] chat resync', e);
          }
        }
        await renderActiveView();
        if (activeFilter !== 'review' && !feedBootstrapStarted) {
          loadAllData({ silent: true });
        }
      };
    });
  }

  let reviewItems = { logs: [], tags: [] };
  let reviewLoadError = '';

  function withReviewTimeout(promise) {
    let timer = null;
    const timeout = new Promise(function (_, reject) {
      timer = setTimeout(function () {
        reject(new Error('review_items_timeout'));
      }, REVIEW_ITEMS_TIMEOUT_MS);
    });
    return Promise.race([promise, timeout]).finally(function () {
      if (timer) clearTimeout(timer);
    });
  }

  async function renderActiveView() {
    if (activeFilter === 'review') {
      await loadReviewItems();
      renderReviewQueue();
      const total = (reviewItems.logs || []).length + (reviewItems.tags || []).length;
      if (reviewLoadError) {
        setSyncStatus('রিভিউ তালিকা লোড হয়নি — আবার রিফ্রেশ চেষ্টা করুন।', 'warn');
      } else {
        setSyncStatus(total ? 'রিভিউ তালিকা লোড হয়েছে।' : 'রিভিউ বাকি নেই।', 'ok');
      }
    } else {
      renderFeed();
    }
  }

  async function refreshCurrentView(options) {
    options = options || {};
    if (activeFilter === 'review') {
      if (!options.silent) setSyncStatus('রিভিউ তালিকা আপডেট হচ্ছে…');
      await renderActiveView();
      return;
    }
    await loadAllData(options);
  }

  async function loadReviewItems() {
    reviewLoadError = '';
    try {
      if (!window.MMSharedAPI || !MMSharedAPI.adminPendingReviewItems) {
        throw new Error('review_api_missing');
      }
      const res = await withReviewTimeout(MMSharedAPI.adminPendingReviewItems(khActorId, khPin));
      if (!res || !res.ok) throw new Error((res && res.error) || 'review_items_failed');
      reviewItems = { logs: res.logs || [], tags: res.tags || [] };
    } catch (e) {
      console.warn('[Recent] load review items', e);
      reviewLoadError = (e && e.message) || String(e);
      reviewItems = { logs: [], tags: [] };
    }
  }

  function logContextLabel(l) {
    return l.type === 'class' ? 'শ্রেণি লগ — ' + (l.context || '') : 'ছাত্র — ' + (l.context || '');
  }

  function renderReviewQueue() {
    const logs = reviewItems.logs;
    const tags = reviewItems.tags;
    const countEl = document.getElementById('recent-count');
    const total = logs.length + tags.length;
    if (countEl) {
      countEl.hidden = !total;
      countEl.textContent = 'মোট ' + bn(total) + ' টি রিভিউ বাকি';
    }
    if (!total) {
      document.getElementById('recent-feed').innerHTML =
        '<div class="recent-empty">এখন কোনো রিভিউ বাকি নেই।</div>';
      return;
    }
    let html = '';
    logs.forEach((l) => {
      html += `<div class="rv-item" data-log-id="${esc(l.id)}">
        <div class="rv-meta"><span>${esc(logContextLabel(l))} · ${esc(l.by || '')}</span><span>${esc(AdminRecentFeed.dateLabel(l.date))}</span></div>
        <div class="rv-text">${esc(l.content)}</div>
        <textarea class="rv-reply-ta" rows="2" placeholder="মন্তব্য/নির্দেশনা লিখুন (ঐচ্ছিক)…"></textarea>
        <div class="rv-actions">
          <button type="button" class="rv-btn done" onclick="submitLogReview('${esc(l.id)}')">ডান</button>
        </div>
      </div>`;
    });
    tags.forEach((m) => {
      html += `<div class="rv-item" data-msg-id="${esc(m.id)}">
        <div class="rv-meta"><span>চ্যাট ট্যাগ · ${esc(m.from_name || '')}</span><span>${esc(AdminRecentFeed.dateLabel(m.ts))}</span></div>
        <div class="rv-text">🏷️ ${esc(m.student_name || '')} সম্পর্কে: ${esc(m.text || '')}</div>
        <div class="rv-actions">
          <a class="rv-btn goto" href="/chat.html?thread=${encodeURIComponent(m.thread_id || '')}">চ্যাটে যান</a>
          <button type="button" class="rv-btn done" onclick="resolveTagFromQueue('${esc(m.id)}')">ডান করুন</button>
        </div>
      </div>`;
    });
    document.getElementById('recent-feed').innerHTML = html;
  }

  async function submitLogReview(logId) {
    const item = document.querySelector('.rv-item[data-log-id="' + logId + '"]');
    const ta = item ? item.querySelector('.rv-reply-ta') : null;
    const reply = ta ? ta.value.trim() : '';
    try {
      const res = await MMSharedAPI.adminReviewLog(khActorId, khPin, logId, reply || null);
      if (!res || !res.ok) throw new Error((res && res.error) || 'review_failed');
      reviewItems.logs = reviewItems.logs.filter((l) => l.id !== logId);
      renderReviewQueue();
      if (typeof MMSyncReviewBadge === 'function') MMSyncReviewBadge();
    } catch (e) {
      console.warn('[Recent] review log', e);
      alert('রিভিউ সংরক্ষণ ব্যর্থ হয়েছে।');
    }
  }

  async function resolveTagFromQueue(messageId) {
    try {
      const res = await ChatAPI.updateRequestRemote(chatActorId, chatPin, messageId, 'approved');
      if (!res || !res.ok) throw new Error((res && res.error) || 'request_update_failed');
      reviewItems.tags = reviewItems.tags.filter((m) => m.id !== messageId);
      renderReviewQueue();
      if (typeof MMSyncReviewBadge === 'function') MMSyncReviewBadge();
    } catch (e) {
      console.warn('[Recent] resolve tag', e);
      alert('ট্যাগ সমাধান করা যায়নি।');
    }
  }

  function renderFeed() {
    const items = AdminRecentFeed.buildFeed({
      restricted,
      filter: activeFilter,
      limit: AdminRecentFeed.MAX_ITEMS,
    });
    const countEl = document.getElementById('recent-count');
    if (countEl) {
      countEl.hidden = !items.length;
      countEl.textContent = 'মোট ' + bn(items.length) + ' টি সাম্প্রতিক রেকর্ড';
    }

    if (!items.length) {
      document.getElementById('recent-feed').innerHTML =
        '<div class="recent-empty">এই ফিল্টারে এখনো কোনো কার্যক্রমের রেকর্ড নেই। রিফ্রেশ চেষ্টা করুন।</div>';
      return;
    }

    let html = '';
    let lastGroup = '';
    items.forEach((it) => {
      if (it.dayGroup !== lastGroup) {
        lastGroup = it.dayGroup;
        html += `<div class="recent-day">${esc(it.dayGroup)}</div>`;
      }
      const tag = it.href ? 'a' : 'div';
      const hrefAttr = it.href ? ` href="${esc(it.href)}"` : '';
      html +=
        `<${tag} class="recent-item"${hrefAttr} data-id="${esc(it.id)}">` +
        `<div class="recent-item-top">` +
        `<span class="recent-badge"><span class="recent-badge-dot" style="background:${esc(it.color)};"></span>${esc(it.typeLabel)}</span>` +
        `<span class="recent-date">${esc(it.dateDisplay)}</span>` +
        `</div>` +
        `<div class="recent-text">${esc(it.text)}</div>` +
        (it.meta ? `<div class="recent-meta">${esc(it.meta)}</div>` : '') +
        `</${tag}>`;
    });
    document.getElementById('recent-feed').innerHTML = html;
  }

  async function loadAllData(options) {
    options = options || {};
    if (activeFilter === 'review') return;
    if (isLoading && !options.force) return;
    isLoading = true;
    feedBootstrapStarted = true;
    const btn = document.getElementById('recent-refresh-btn');
    if (btn) btn.disabled = true;
    const scope = activeFilter === 'madrasa' ? 'minimal' : 'full';
    const bootOpts = {
      pin: khPin,
      actorId: khActorId,
      chatPin,
      chatActorId,
      restricted,
      force: !!options.force,
      scope,
    };
    try {
      if (!options.silent) {
        setSyncStatus(options.force ? 'সব উৎস থেকে রিফ্রেশ…' : 'সর্বশেষ আপডেট চলছে…');
      }
      const res = await AdminRecentFeed.bootstrapAll(bootOpts);
      const errs = res.errors || [];
      if (errs.length) {
        const detail = errs.map((x) => x.label + (x.message ? ' (' + x.message + ')' : '')).join(', ');
        setSyncStatus('আংশিক লোড: ' + detail + ' — যা পাওয়া গেছে তা দেখানো হচ্ছে।', 'warn');
      } else {
        setSyncStatus('সর্বশেষ ডাটা লোড হয়েছে। ' + bn(AdminRecentFeed.MAX_ITEMS) + ' টি পর্যন্ত দেখানো হয়।', 'ok');
      }
      await renderActiveView();
    } catch (err) {
      console.error('[Recent]', err);
      setSyncStatus('ডাটা লোড ব্যর্থ। আবার রিফ্রেশ চেষ্টা করুন।', 'warn');
      await renderActiveView();
    } finally {
      isLoading = false;
      if (btn) btn.disabled = false;
    }
  }

  async function initRecent() {
    renderFilters();
    document.getElementById('recent-refresh-btn').onclick = () => refreshCurrentView({ force: true });
    AdminRecentFeed.prepareLocalCaches({
      actorId: khActorId,
      pin: khPin,
      chatPin,
      chatActorId,
      restricted,
    });
    await renderActiveView();
    if (activeFilter === 'review') return;
    const warm = window.MMSession && MMSession.isAppDataWarm && MMSession.isAppDataWarm();
    if (warm || AdminRecentFeed.hasAnyFeedData()) {
      setSyncStatus('ক্যাশ দেখানো হচ্ছে — আপডেট চলছে…');
    } else {
      setSyncStatus('ডাটা লোড হচ্ছে…');
    }
  }

  MMLoading.run(initRecent).finally(function () {
    if (activeFilter !== 'review' && !feedBootstrapStarted) {
      loadAllData({ silent: true });
    }
  });
</script>
<script src="../js/shared/admin-nav.js"></script>
